name: directory-lint

# Checks each push against the plugin directory's rules before the developer
# portal does: `claude plugin validate --strict` for structure, then
# directory_lint.py for the rows of the pre-submission checklist
# (https://claude.com/docs/plugins/pre-submission-checklist). Releases already
# pass the same checks before they are pushed, so a failure here means the
# release gate missed something.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - run: python3 -B .github/scripts/directory_lint.py .
      # Exact pin: the version whose validate coverage the release tests pin.
      - run: npm install -g @anthropic-ai/claude-code@2.1.267
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict .claude-plugin/plugin.json
